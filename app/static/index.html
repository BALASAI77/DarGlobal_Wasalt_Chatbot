<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal & Wasalt Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --accent:#0f766e; --user:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1317; --card:#171c22; --ink:#e7eaee; --muted:#93a0ad; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid #8883; background:var(--card); }
  header h1 { margin:0; font-size:17px; }
  header p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .m { padding:10px 14px; border-radius:12px; max-width:85%; line-height:1.5; white-space:pre-wrap; }
  .bot { background:var(--card); border:1px solid #8883; align-self:flex-start; }
  .me { background:var(--user); color:#fff; align-self:flex-end; }
  .src { font-size:12px; color:var(--muted); margin-top:6px; }
  .src a { color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { border:1px solid #8884; background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
  form { display:flex; gap:8px; padding:14px 20px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #8885; background:var(--card); color:var(--ink); font-size:15px; }
  button.send { padding:0 20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>DarGlobal &amp; Wasalt Assistant</h1>
  <p>Answers based on publicly available information from both companies' websites.</p>
</header>
<div id="log">
  <div class="m bot">Hi! Ask me about DarGlobal or Wasalt: their projects, services, and what they do.</div>
  <div class="chips">
    <button>What does DarGlobal do?</button>
    <button>What is Wasalt?</button>
    <button>What services does Wasalt offer?</button>
    <button>Tell me about DarGlobal's projects</button>
  </div>
</div>
<form id="f">
  <input id="q" placeholder="Type your question..." autocomplete="off" required>
  <button class="send" id="b">Send</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');
let history = [];
function add(text, cls, sources) {
  const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div'); s.className = 'src'; s.append('Sources: ');
    sources.slice(0, 4).forEach((u, i) => { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = new URL(u).pathname === '/' ? new URL(u).host : new URL(u).host + new URL(u).pathname; s.append(a); if (i < Math.min(sources.length, 4) - 1) s.append(' · '); });
    d.append(s);
  }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask(text) {
  add(text, 'me'); b.disabled = true;
  const wait = add('Thinking...', 'bot');
  try {
    const r = await fetch('/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text, history }) });
    const j = await r.json();
    wait.remove();
    if (!r.ok) { add('Error: ' + (j.detail || r.status), 'bot'); }
    else { add(j.answer, 'bot', j.sources); history.push({role:'user',content:text},{role:'assistant',content:j.answer}); }
  } catch (e) { wait.remove(); add('Network error: ' + e.message, 'bot'); }
  b.disabled = false; q.focus();
}
f.addEventListener('submit', e => { e.preventDefault(); const t = q.value.trim(); if (t) { q.value = ''; ask(t); } });
document.querySelectorAll('.chips button').forEach(c => c.onclick = () => ask(c.textContent));
</script>
</body>
</html>
